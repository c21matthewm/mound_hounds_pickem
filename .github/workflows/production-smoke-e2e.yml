name: Production Smoke E2E

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public production origin (optional; protected previews are excluded)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    env:
      PW_INCLUDE_FIREFOX: "1"
      PW_READ_ONLY: "1"
      PW_USE_EXISTING_SERVER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Choose public production smoke target
        id: target
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { selectSmokeTarget } from './scripts/lib/smoke-readiness.ts';
          try {
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const target = selectSmokeTarget(process.env.GITHUB_EVENT_NAME, event, process.env.PRODUCTION_URL);
            if (!target) {
              const message = 'Skipped: this is not a successful production deployment. Preview protection remains enabled; no application requests were sent.';
              console.log(message);
              appendFileSync(process.env.GITHUB_OUTPUT, 'run_smoke=false\n');
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n');
            } else {
              appendFileSync(process.env.GITHUB_OUTPUT, `run_smoke=true\nvalue=${target.origin}\n`);
            }
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          }
          NODE

      - name: Select tested npm
        if: steps.target.outputs.run_smoke == 'true'
        run: node scripts/install-toolchain.mjs

      - name: Wait for public application login readiness
        if: steps.target.outputs.run_smoke == 'true'
        env:
          PW_BASE_URL: ${{ steps.target.outputs.value }}
        run: node scripts/smoke-readiness.mjs

      - name: Install dependencies
        if: steps.target.outputs.run_smoke == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.target.outputs.run_smoke == 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Run anonymous read-only production smoke
        if: steps.target.outputs.run_smoke == 'true'
        env:
          PW_BASE_URL: ${{ steps.target.outputs.value }}
        run: npx playwright test tests/e2e/production-readonly.spec.ts --config=playwright.config.ts --reporter=line,github
