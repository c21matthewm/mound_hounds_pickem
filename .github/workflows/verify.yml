name: Verify

on:
  pull_request:
  push:
    branches:
      - dev
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          # The bundled npm can differ from devEngines; bootstrap before caching.
          package-manager-cache: false

      - name: Select the pinned npm version
        run: node scripts/install-toolchain.mjs

      - name: Restore npm download cache
        uses: actions/setup-node@v7
        with:
          # Keep the already-selected runtime and its bootstrapped npm.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and build
        run: npm run verify

      - name: Audit production dependencies
        run: npm run audit:prod

  results-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/requirements-dev.txt
      - run: python -m pip install -r services/requirements-dev.txt
      - name: Offline Python service checks
        run: PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -B -m pytest tests/python -q -p no:cacheprovider
